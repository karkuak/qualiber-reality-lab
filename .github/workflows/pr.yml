# PR lane (implementation plan §17.4): contract, canonicalization, architecture
# purity, fake lifecycle, unit, type and lint checks on every change.
name: pr

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pr:
    runs-on: ubuntu-latest
    # M2 CI-timeout rider (roadmap MP-20): observed duration across the 8 most
    # recent successful runs was 36m19s-40m06s; 60 minutes gives ~1.5x headroom
    # for normal variance while still bounding a genuinely hung job to well
    # under GitHub's own 360-minute default.
    timeout-minutes: 60
    # The claim-ceiling append-only check compares the identifier history with the
    # same file at the pull request's own base commit, so the lane needs the base
    # object present and the base sha named explicitly. It fails closed rather than
    # skipping when a pull request does not supply one.
    env:
      CLAIM_CEILING_BASE: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generated types are current
        run: npm run verify:generated
      - name: Type check
        run: npm run build
      - name: Contract, canonicalization, purity, lifecycle, environment and adversarial suites
        run: npm test
      - name: ERL2-OQ-005 — the qualified lock enables Compose, an unqualified one does not
        run: |
          node --test \
            "tests/dist/integration/environment.test.js" \
            "tests/dist/adversarial/composeSubstrate.test.js" \
            "tests/dist/adversarial/composeCliAdmission.test.js"
      - name: ERL2-OQ-007 fail-closed and oracle partition
        run: node --test "tests/dist/adversarial/oracle.test.js" "tests/dist/e2e/journeyRun.test.js"
      - name: ADR-ERL2-013 — one authorized continuation after a verified package
        run: node --test "tests/dist/adversarial/preEnvironmentTerminal.test.js"
      - name: ERL2-OQ-001 fail-closed, hostile adapters and certification
        run: |
          node --test \
            "tests/dist/adversarial/adapterHost.test.js" \
            "tests/dist/integration/adapterCertification.test.js" \
            "tests/dist/e2e/adapterJourney.test.js"
      - name: Adapter packages are removable
        run: node --test "tests/dist/architecture/removability.test.js" "tests/dist/architecture/adapterSurface.test.js"
      - name: Evidence byte-pin (838 files byte-identical to the pinned goldens; exactly 7 exact-path exclusions, each printed, with the exclusion manifest and the coverage counts themselves pinned)
        run: npm run evidence:verify
      - name: Golden fixtures must not drift (P2-10 — routine verification never rewrites approved evidence)
        run: git diff --exit-code -- fixtures/golden
      - name: Offline verification with the network disabled
        run: |
          node packages/cli/dist/src/bin.js verify \
            --public-bundle fixtures/golden/valid-pre-environment-run/public-bundle.json \
            --root-config fixtures/golden/valid-pre-environment-run/root-config.json \
            --artifact-root fixtures/golden/valid-pre-environment-run/artifacts \
            --lifecycle fixtures/golden/valid-pre-environment-run/lifecycle.json \
            --offline
      - name: Invalid-record verification
        run: |
          node packages/cli/dist/src/bin.js verify-record \
            --record fixtures/golden/invalid-run-cancellation/invalid-record.json \
            --lifecycle fixtures/golden/invalid-run-cancellation/lifecycle.json \
            --artifact-root fixtures/golden/invalid-run-cancellation/artifacts \
            --root-config fixtures/golden/invalid-run-cancellation/root-config.json \
            --offline
      # M3: the committed neutral trusted-local worked example is executed here,
      # from its committed drafts, on every change. Nothing it produces is
      # compared against a stored copy and nothing it produces is committed, so
      # this is a proof that the documented operator path still works rather
      # than a byte-diff against a golden that could itself go stale.
      - name: Neutral trusted-local worked example runs end to end
        timeout-minutes: 5
        run: |
          set -euo pipefail
          ./examples/trusted-local-neutral/run-example.sh | tee "$RUNNER_TEMP/example.log"
      - name: The worked example's independent verifier reported success
        run: |
          set -euo pipefail
          grep -q '"ok": true' "$RUNNER_TEMP/example.log"
          grep -q '"terminal_status": "observed_complete"' "$RUNNER_TEMP/example.log"
          grep -q '"cleanup_status": "cleanup_complete"' "$RUNNER_TEMP/example.log"
      - name: The worked example's scratch root is removed by its own guarded cleanup
        run: |
          set -euo pipefail
          scratch="$(sed -n 's/^== scratch root (remove it explicitly): //p' "$RUNNER_TEMP/example.log" | tail -1)"
          test -n "$scratch"
          ./examples/trusted-local-neutral/cleanup-example.sh "$scratch"
          test ! -e "$scratch"
      - name: The worked example left no residue in the working tree
        run: |
          set -euo pipefail
          git status --porcelain > "$RUNNER_TEMP/residue.txt"
          if [ -s "$RUNNER_TEMP/residue.txt" ]; then
            echo "the example wrote into the working tree:"; cat "$RUNNER_TEMP/residue.txt"; exit 1
          fi

  cross-platform-golden:
    # ERL2-NFR-001: JCS, hash and signature goldens must match on both platforms.
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # M2 CI-timeout rider (roadmap MP-20): observed duration across the 8 most
    # recent successful runs was 1m14s-1m46s on both legs; 10 minutes gives
    # ~5-8x headroom for normal variance while still cutting a genuine hang
    # from hours to minutes.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test "tests/dist/integration/*.test.js"
